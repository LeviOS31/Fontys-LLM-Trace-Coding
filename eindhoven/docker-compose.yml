services:
  db:
    image: docker.io/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
      POSTGRES_DB: ${PG_DATABASE:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  llmtc-frontend:
    build:
      context: ./
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://llmtc-backend:3001}
        DOCKER_BUILDKIT: 1
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      llmtc-backend:
        condition: service_healthy

  llmtc-backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD:-password}@${PG_HOST:-db}:${PG_PORT:-5432}/${PG_DATABASE:-postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_URL: ${OPENAI_URL:-http://localhost:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-llama3.1:8b}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  db_data:
