name: SonarCloud
on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java (Required for Sonar Scanner)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        
        with:
          dotnet-version: '8.0.x'
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARTOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"LeviOS31_Fontys-LLM-Trace-Coding" /o:"levios31" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build backend/Api
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"