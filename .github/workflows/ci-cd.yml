name: CI/CD

on:
  # Feature branches are covered by pull_request, so push only runs on main.
  # This avoids every PR commit triggering two identical runs.
  # To also get checks on branches without a PR, change to: branches: ["**"]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_browser_suite:
        description: "Run all Cypress E2E specs as a pre-release browser check"
        type: boolean
        default: false
        required: false

# Least privilege by default; the deploy job opts in to what it needs.
permissions:
  contents: read

# Cancel superseded runs on branches/PRs, but never cancel a run on main
# (a half-finished deploy is worse than a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # global.json in backend/ pins the exact SDK version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Test
        working-directory: backend
        run: |
          if find . -iregex '.*\(Test\|Tests\)\.csproj$' | grep -q .; then
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No .NET test projects found yet — skipping."
          fi

  frontend-lint-typecheck:
    name: Frontend lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # These jobs never run Cypress, so skip the ~200 MB binary download.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/webapp

      - name: Lint
        run: npm run lint
        working-directory: frontend/webapp

      - name: Type check
        run: npx tsc -b --pretty false
        working-directory: frontend/webapp

      - name: Cypress type check
        run: npx tsc -p cypress/tsconfig.json --noEmit --moduleResolution bundler --skipLibCheck
        working-directory: frontend/webapp

  # The full Vitest run already includes the retrieval integration test that
  # used to have its own job, so it is no longer executed twice.
  frontend-unit-component:
    name: Frontend unit, component and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/webapp

      - name: Run unit, component and integration tests
        run: npm test -- --run
        working-directory: frontend/webapp

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-lint-typecheck, frontend-unit-component]
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/webapp

      - name: Build frontend
        run: npm run build
        working-directory: frontend/webapp

  frontend-lighthouse:
    name: Frontend Lighthouse audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/webapp

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse CI
        run: npm run lighthouse
        working-directory: frontend/webapp
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/webapp/.lighthouseci
          if-no-files-found: ignore

  docker-build:
    name: Docker build (with layer cache)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No QEMU here: this job only builds for the runner's own platform.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/webapp
          file: ./frontend/webapp/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:8080
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/MigrationRunner/Dockerfile
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  smoke-test:
    name: Selected browser tests and full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [docker-build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      CYPRESS_BASE_URL: http://localhost:3000
      CYPRESS_SKIP_DOCKER_RESET: "true"
      TEST_DATABASE_URL: postgres://user:password@localhost:5432/mydb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/webapp/package-lock.json

      # The Cypress binary is not covered by the npm cache.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/webapp/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install frontend and Cypress dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/webapp

      - name: Verify Cypress binary
        run: npx cypress verify
        working-directory: frontend/webapp

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: |
          sudo systemctl enable ollama
          sudo systemctl start ollama
          sudo systemctl status ollama --no-pager

      - name: Wait for Ollama to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
              echo "Ollama is up"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready in time — dumping diagnostics:"
          sudo systemctl status ollama --no-pager || true
          sudo journalctl -u ollama --no-pager | tail -n 100 || true
          exit 1

      # Lets docker compose use the GitHub Actions layer cache (type=gha).
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Write Compose override for CI networking and caching
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            db:
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
                interval: 5s
                timeout: 5s
                retries: 10
            migrator:
              build:
                cache_from:
                  - type=gha,scope=migrator
              depends_on:
                db:
                  condition: service_healthy
            backend:
              build:
                cache_from:
                  - type=gha,scope=backend
              extra_hosts:
                - "host.docker.internal:host-gateway"
              depends_on:
                db:
                  condition: service_healthy
                migrator:
                  condition: service_completed_successfully
            frontend:
              build:
                cache_from:
                  - type=gha,scope=frontend
          EOF

      # Read-only cache use: docker-build already writes these scopes.
      - name: Start stack
        env:
          COMPOSE_BAKE: "true"
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --build

      - name: Wait for backend to respond
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo "000")
            if [ "$status" != "000" ]; then
              echo "Backend is up (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Wait for frontend to respond
        run: |
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo "000")
            if [ "$status" != "000" ]; then
              echo "Frontend is up (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          exit 1

      - name: Run selected LLM and trace-group E2E tests
        run: npx cypress run --browser electron --spec "cypress/e2e/llm-content.cy.ts,cypress/e2e/trace-group.cy.ts"
        working-directory: frontend/webapp

      - name: Run accessibility E2E checks when present
        if: hashFiles('frontend/webapp/cypress/e2e/**/*.a11y.cy.ts') != ''
        run: npx cypress run --browser electron --spec "cypress/e2e/**/*.a11y.cy.ts"
        working-directory: frontend/webapp

      - name: Report accessibility checks are not implemented yet
        if: hashFiles('frontend/webapp/cypress/e2e/**/*.a11y.cy.ts') == ''
        run: echo "No Cypress-specific accessibility specs found; axe route scans run in the frontend Vitest suite."

      - name: Run visual regression E2E checks when present
        if: github.event_name == 'pull_request' && hashFiles('frontend/webapp/cypress/e2e/visual-regression.cy.ts') != ''
        run: npx cypress run --browser electron --env skipDockerReset=true,skipDbReset=true --spec "cypress/e2e/visual-regression.cy.ts"
        working-directory: frontend/webapp

      - name: Report visual regression checks are not implemented yet
        if: github.event_name == 'pull_request' && hashFiles('frontend/webapp/cypress/e2e/visual-regression.cy.ts') == ''
        run: echo "Visual regression spec not found."

      - name: Run the full Cypress suite for a manual pre-release check
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_browser_suite
        run: npx cypress run --browser electron
        working-directory: frontend/webapp

      - name: Remind reviewers about manual release audits
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_browser_suite
        run: echo "::notice::Complete the manual accessibility review and performance audit before release; automated checks are not configured yet."

      - name: Upload Cypress screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-browser-artifacts
          path: |
            frontend/webapp/cypress/screenshots
            frontend/webapp/cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v

  deploy:
    name: Build & push images (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [smoke-test]
    if: github.ref == 'refs/heads/main'
    # Never run two deploys at once, and never cancel one midway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and build version
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=build-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ env.BUILD_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/webapp
          file: ./frontend/webapp/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_URL=http://localhost:8080
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ env.BUILD_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/MigrationRunner/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrator:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrator:${{ env.BUILD_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrator:${{ github.sha }}

      - name: Generate release compose file
        run: |
          cat > docker-compose.release.yml <<EOF
          name: TraceEvalCompose

          services:
            frontend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ env.BUILD_VERSION }}
              ports:
                - "3000:8080"

            backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ env.BUILD_VERSION }}
              environment:
                ConnectionStrings__Default: Host=db;Port=5432;Database=mydb;Username=user;Password=\${POSTGRES_PASSWORD}
                AI__Provider: Ollama
                AI__Ollama__Endpoint: http://host.docker.internal:11434
                AI__Ollama__Model: gpt-oss:120b-cloud
                Cors__AllowedOrigins: http://localhost:3000
              ports:
                - "8080:8080"

            db:
              image: postgres:18
              container_name: traceeval_database
              environment:
                POSTGRES_USER: user
                POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                POSTGRES_DB: mydb
              ports:
                - "5432:5432"
              volumes:
                - postgres_data_V2:/var/lib/postgresql

            migrator:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrator:${{ env.BUILD_VERSION }}
              depends_on:
                - db
              environment:
                - ConnectionStrings__Default=Host=db;Port=5432;Database=mydb;Username=user;Password=\${POSTGRES_PASSWORD}
              restart: on-failure

          volumes:
            postgres_data_V2:

          networks:
            default:
              name: traceeval_network
          EOF

          cat > .env.example <<'EOF'
          # Copy this to .env and set a real value before running:
          #   cp .env.example .env
          POSTGRES_PASSWORD=changeme
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: ${{ env.BUILD_VERSION }}
          files: |
            docker-compose.release.yml
            .env.example
          generate_release_notes: true
