version: '3.8'
name: TestDbCompose

services:
  db:
    image: postgres:18
    container_name: TestDb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  migrator:
    build:
      context: .
      dockerfile: MigrationRunner/Dockerfile
    depends_on:
      - db
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=mydb;Username=user;Password=password
    restart: on-failure

volumes:
  postgres_data: